# Cấu hình Multi-Provider Agent Swarm (/speckit-auto) cho BaSa3D.
# Phân vai theo AI_WORKFLOW.md: Gemini = challenger viết spec, Claude = architect + final reviewer,
# OpenAI (vai Codex) = implementation owner, Ollama = sửa lint vặt (không có thì dùng Claude).
# Tên model + bảng giá (USD / 1 triệu token) lấy từ nguồn thứ ba ngày 2026-10-18.
# PHẢI xác minh lại trên trang giá chính thức trước khi dùng thật — ngân sách
# của mỗi run được tính từ các con số này. Khi không chắc, để giá CAO hơn thực tế.

[run]
budget_usd = 2.0                          # dừng + hỏi khi sắp vượt
worktree_root = "../BaSa3D-swarm"   # tương đối so với gốc repo (NGOÀI repo để eslint/tsc không quét)
branch_prefix = "feature/"
max_coder_steps = 40                      # số lượt tool-calling tối đa mỗi lần Coder chạy
max_qa_rounds = 2
max_fix_rounds = 2
max_revisions = 3                         # số lần "Yêu cầu sửa" ở mỗi gate
http_timeout_s = 300
e2e = "auto"     # auto: chạy Playwright khi đổi src/ | e2e/ | supabase/migrations/ VÀ có TEST_* local; always | never
build = "auto"   # auto: chạy next build khi đổi src/, messages/, next.config…; always | never

[providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

[providers.google]
kind = "openai_compat"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"

[providers.openai]
kind = "openai_compat"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_tokens_field = "max_completion_tokens"  # model mới của OpenAI không nhận max_tokens
send_temperature = false                    # model reasoning chỉ nhận temperature mặc định

[providers.ollama]
kind = "openai_compat"
base_url = "http://localhost:11434/v1"
api_key_env = ""                          # Ollama local không cần key

# ---- Bảng giá (USD / 1M token). Giá trị thận trọng (lấy mức cao khi nguồn mâu thuẫn).
[models."anthropic/claude-sonnet-5-5"]
input_per_mtok = 3.0
output_per_mtok = 15.0
context_tokens = 1000000

[models."google/gemini-3.1-pro-preview"]
input_per_mtok = 2.0
output_per_mtok = 12.0
context_tokens = 1000000     # >200k token prompt bị tính giá cao hơn → role spec giới hạn 80k

[models."google/gemini-3.8-flash"]
# Nguồn thứ ba 2026-10: $0.75/$3.75 tới 31/12/2026, tăng lên $1.50/$7.50 từ 2027 → để mức 2027 cho an toàn.
input_per_mtok = 1.5
output_per_mtok = 7.5
context_tokens = 1000000

[models."openai/gpt-5.6-terra"]
input_per_mtok = 2.5
output_per_mtok = 15.0
context_tokens = 400000

[models."ollama/qwen2.5-coder:7b"]
input_per_mtok = 0.0
output_per_mtok = 0.0
context_tokens = 32000

# ---- Vai trò. `models` = chuỗi dự phòng theo thứ tự ưu tiên. Model thiếu key bị bỏ qua ngay
# (không gọi mạng), nên chỉ cần MỘT key bất kỳ là cả luồng vẫn chạy — Gemini nằm cuối mọi chuỗi.
[roles.spec]
title = "Spec Lead (Gemini challenger)"
models = ["google/gemini-3.1-pro-preview", "anthropic/claude-sonnet-5-5"]
temperature = 0.2
max_output_tokens = 8000
context_budget_tokens = 80000

[roles.architect]
title = "Architect (Claude)"
models = ["anthropic/claude-sonnet-5-5", "openai/gpt-5.6-terra", "google/gemini-3.1-pro-preview"]
temperature = 0.1
max_output_tokens = 12000
context_budget_tokens = 50000

[roles.coder]
title = "Coder (Codex)"
models = ["openai/gpt-5.6-terra", "anthropic/claude-sonnet-5-5", "google/gemini-3.1-pro-preview"]
temperature = 0.1
max_output_tokens = 8000
context_budget_tokens = 0

[roles.qa]
title = "Final Reviewer (Claude)"
models = ["anthropic/claude-sonnet-5-5", "google/gemini-3.1-pro-preview"]
temperature = 0.2
max_output_tokens = 6000
context_budget_tokens = 0

[roles.healer]
title = "Local Healer"
models = ["ollama/qwen2.5-coder:7b", "anthropic/claude-sonnet-5-5", "google/gemini-3.8-flash"]
temperature = 0.0
max_output_tokens = 4000
context_budget_tokens = 0
