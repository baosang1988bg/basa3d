<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Feature 003. Served by scripts/stl-import/render.ts via Playwright page.route — never deployed.
         Extends scripts/model-library-spike/render-page.html: several parts per model, 4 (or 2)
         product views, light neutral background, soft ground shadow, chosen material colour. -->
    <script type="importmap">
      { "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
    </script>
    <style>html,body{margin:0;background:#eef1f4}</style>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { STLLoader } from 'three/addons/loaders/STLLoader.js';

      const BACKGROUND = 0xeef1f4;
      // Directions in three.js (Y-up) space; the cover is the 3/4 front view (FR-004).
      const VIEWS = {
        cover: { dir: [1, 0.8, 1.3] },
        front: { dir: [0, 0.18, 1] },
        side: { dir: [1, 0.18, 0] },
        top: { dir: [0.0001, 1, 0.0001], up: [0, 0, -1] },
      };

      let renderer;
      function getRenderer(size) {
        if (!renderer) {
          renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
          renderer.setPixelRatio(1);
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          document.body.appendChild(renderer.domElement);
        }
        renderer.setSize(size, size);
        return renderer;
      }

      function disposeTree(root) {
        root.traverse((o) => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
        });
      }

      function withDims(canvas, size, quality, dims) {
        const c = document.createElement('canvas');
        c.width = size; c.height = size;
        const ctx = c.getContext('2d');
        ctx.drawImage(canvas, 0, 0);
        const label = `${dims.x} × ${dims.y} × ${dims.z} mm`;
        ctx.font = `600 ${Math.round(size / 24)}px system-ui, sans-serif`;
        const w = ctx.measureText(label).width + size / 20;
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillRect(size / 30, size - size / 9, w, size / 14);
        ctx.fillStyle = '#1f2937';
        ctx.fillText(label, size / 30 + size / 40, size - size / 9 + size / 20);
        return c.toDataURL('image/webp', quality);
      }

      // urls: one per part (same model, original coordinates kept — parts are usually an assembly/plate).
      window.renderModel = async (urls, options) => {
        const { size, quality, color, views, dims } = options;
        const root = new THREE.Group();
        const material = new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: 0.6, metalness: 0.02, side: THREE.DoubleSide });
        for (const url of urls) {
          const geometry = new STLLoader().parse(await (await fetch(url)).arrayBuffer());
          // Many exporters write all-zero facet normals; always recompute (flat, the geometry is non-indexed).
          geometry.computeVertexNormals();
          const mesh = new THREE.Mesh(geometry, material);
          mesh.castShadow = true;
          root.add(mesh);
        }
        // Print files are Z-up (slicer convention); three.js is Y-up.
        root.rotation.x = -Math.PI / 2;
        root.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(root);
        if (box.isEmpty()) throw new Error('EMPTY_GEOMETRY');
        const center = box.getCenter(new THREE.Vector3());
        const radius = box.getBoundingSphere(new THREE.Sphere()).radius;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(BACKGROUND);
        scene.add(root);
        scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.5));
        const key = new THREE.DirectionalLight(0xffffff, 2.0);
        key.position.copy(center).add(new THREE.Vector3(radius * 1.5, radius * 3, radius * 2));
        key.target.position.copy(center);
        key.castShadow = true;
        key.shadow.mapSize.set(2048, 2048);
        key.shadow.radius = 6;
        const s = key.shadow.camera;
        s.left = -radius * 2; s.right = radius * 2; s.top = radius * 2; s.bottom = -radius * 2; s.near = radius / 10; s.far = radius * 10;
        scene.add(key, key.target);
        const rim = new THREE.DirectionalLight(0xffffff, 0.6);
        rim.position.copy(center).add(new THREE.Vector3(-radius * 2, radius, -radius * 1.5));
        scene.add(rim);
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(radius * 12, radius * 12), new THREE.ShadowMaterial({ opacity: 0.18 }));
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(center.x, box.min.y - radius * 0.002, center.z);
        ground.receiveShadow = true;
        scene.add(ground);

        const fov = 30;
        const r = getRenderer(size);
        const names = views === 2 ? ['cover', 'front'] : ['cover', 'front', 'side', 'top'];
        const images = [];
        for (const name of names) {
          const view = VIEWS[name];
          const camera = new THREE.PerspectiveCamera(fov, 1, radius / 100, radius * 100);
          if (view.up) camera.up.set(...view.up);
          const dist = (radius * 1.15) / Math.sin(THREE.MathUtils.degToRad(fov / 2));
          camera.position.copy(center).addScaledVector(new THREE.Vector3(...view.dir).normalize(), dist);
          camera.lookAt(center);
          ground.visible = name !== 'top';
          r.render(scene, camera);
          images.push(r.domElement.toDataURL('image/webp', quality));
          if (name === 'cover' && dims) images.push(withDims(r.domElement, size, quality, dims));
        }
        disposeTree(root);
        ground.geometry.dispose();
        return images;
      };

      window.__ready = true;
    </script>
  </body>
</html>
