<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Served by generate-previews.mjs via Playwright page.route — never deployed. -->
    <script type="importmap">
      { "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
    </script>
    <style>html,body{margin:0;background:#fff}</style>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { STLLoader } from 'three/addons/loaders/STLLoader.js';
      import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';

      let renderer;
      function getRenderer(size) {
        if (!renderer) {
          renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
          renderer.setPixelRatio(1);
          document.body.appendChild(renderer.domElement);
        }
        renderer.setSize(size, size);
        return renderer;
      }

      function disposeTree(root) {
        root.traverse((o) => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
        });
      }

      function countTriangles(root) {
        let n = 0;
        root.traverse((o) => {
          if (!o.isMesh) return;
          const g = o.geometry;
          n += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
        });
        return Math.round(n);
      }

      function calculateVolumeCm3(root) {
        let vol = 0;
        root.traverse((o) => {
          if (!o.isMesh || !o.geometry) return;
          const g = o.geometry;
          const pos = g.getAttribute('position');
          if (!pos || pos.itemSize < 3) return;
          const index = g.getIndex();
          const count = index ? index.count / 3 : pos.count / 3;
          let signed = 0;
          for (let i = 0; i < count; i++) {
            const off = i * 3;
            const ai = index ? index.getX(off) : off;
            const bi = index ? index.getX(off + 1) : off + 1;
            const ci = index ? index.getX(off + 2) : off + 2;
            const ax = pos.getX(ai), ay = pos.getY(ai), az = pos.getZ(ai);
            const bx = pos.getX(bi), by = pos.getY(bi), bz = pos.getZ(bi);
            const cx = pos.getX(ci), cy = pos.getY(ci), cz = pos.getZ(ci);
            signed += (ax * (by * cz - bz * cy) - ay * (bx * cz - bz * cx) + az * (bx * cy - by * cx)) / 6;
          }
          vol += Math.abs(signed) / 1000;
        });
        return +vol.toFixed(1);
      }

      // Converts any image bytes (embedded 3MF PNG) to a square WebP on a white background.
      window.imageToWebp = async (url, size, quality) => {
        const blob = await (await fetch(url)).blob();
        const bmp = await createImageBitmap(blob);
        const c = document.createElement('canvas');
        c.width = size; c.height = size;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
        const s = Math.min(size / bmp.width, size / bmp.height);
        const w = bmp.width * s, h = bmp.height * s;
        ctx.drawImage(bmp, (size - w) / 2, (size - h) / 2, w, h);
        return { dataUrl: c.toDataURL('image/webp', quality), sourceWidth: bmp.width, sourceHeight: bmp.height };
      };

      window.renderModel = async (url, kind, size, quality) => {
        const buf = await (await fetch(url)).arrayBuffer();
        const root = new THREE.Group();
        const material = new THREE.MeshStandardMaterial({ color: 0x8fa3b8, roughness: 0.55, metalness: 0.05, side: THREE.DoubleSide });
        if (kind === 'stl') {
          const geometry = new STLLoader().parse(buf);
          if (!geometry.attributes.normal) geometry.computeVertexNormals();
          root.add(new THREE.Mesh(geometry, material));
        } else {
          const obj = new ThreeMFLoader().parse(buf);
          // Keep 3MF colours if present; render both faces because hobby meshes often have flipped normals.
          obj.traverse((o) => {
            if (!o.isMesh) return;
            if (!o.material) o.material = material;
            else (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.side = THREE.DoubleSide; });
          });
          root.add(obj);
        }
        // Print files are Z-up (slicer convention); three.js is Y-up.
        root.rotation.x = -Math.PI / 2;
        root.updateMatrixWorld(true);

        const box = new THREE.Box3().setFromObject(root);
        if (box.isEmpty()) throw new Error('EMPTY_GEOMETRY');
        const sizeMm = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const radius = box.getBoundingSphere(new THREE.Sphere()).radius;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        scene.add(root);
        scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 1.6));
        const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1, 2, 1.5); scene.add(key);
        const rim = new THREE.DirectionalLight(0xffffff, 0.8); rim.position.set(-1.5, 0.5, -1); scene.add(rim);

        const fov = 30;
        const camera = new THREE.PerspectiveCamera(fov, 1, radius / 100, radius * 100);
        const dist = (radius * 1.15) / Math.sin(THREE.MathUtils.degToRad(fov / 2));
        const dir = new THREE.Vector3(1, 0.8, 1.3).normalize();
        camera.position.copy(center).addScaledVector(dir, dist);
        camera.lookAt(center);

        const r = getRenderer(size);
        r.render(scene, camera);
        const dataUrl = r.domElement.toDataURL('image/webp', quality);
        const triangles = countTriangles(root);
        const volumeCm3 = calculateVolumeCm3(root);
        disposeTree(root);
        // box is in rotated (Y-up) space; report it back in slicer axes (x, y = depth, z = height).
        return {
          dataUrl,
          triangles,
          volumeCm3,
          bboxMm: { x: +sizeMm.x.toFixed(1), y: +sizeMm.z.toFixed(1), z: +sizeMm.y.toFixed(1) }
        };
      };

      window.__ready = true;
    </script>
  </body>
</html>
